name: Publish benchmark dashboard
on:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'dashboard/**'
      - 'results/**'
      - 'tools/**'
      - 'lib/**'
      - 'assets.lock.json'
      - '.github/workflows/listening.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: listening-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'ngelik/tts-bench'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node tools/build-listening-site.mjs
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .cache/listening-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy benchmark dashboard
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
