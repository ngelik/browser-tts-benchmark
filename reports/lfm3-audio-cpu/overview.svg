<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="724" viewBox="0 0 1440 724" role="img" aria-labelledby="campaign-title campaign-desc"><title id="campaign-title">Browser TTS campaign metrics</title><desc id="campaign-desc">6 separate panels show Warm generation median, First PCM median, Real-time factor median, Warm output audio duration median, Mean Chrome RSS during generation, Pinned model weights. CPU and WebGPU bars appear when measured; unsupported and missing evidence are labeled. Scenarios are not pooled and this chart does not rate speech quality.</desc><rect width="100%" height="100%" fill="#f4f7f4"/><g font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" fill="#183b35"><text x="34" y="48" font-size="30" font-weight="750">Browser TTS · campaign overview</text><text x="34" y="77" font-size="14" fill="#526c65">MacBook Pro / Apple M1 Pro 8-core / 16 GiB / arm64 · Google Chrome 157.0.8103.40 · 20,000 characters / 93 chunks</text><text x="34" y="99" font-size="12" fill="#62736d">CPU / WASM · WebGPU with allowed CPU fallback · not a quality ranking</text><g><rect x="24" y="122" width="684" height="176" rx="18" fill="#ffffff" stroke="#d9e0de"/><text x="44" y="153" font-size="20" font-weight="700" fill="#183b35">Warm generation median</text><text x="44" y="173" font-size="12" fill="#60716d">seconds · zero-baseline linear scale</text><path d="M199 198V278" stroke="#e8eeeb"/><text x="199" y="191" text-anchor="middle" font-size="10" fill="#667773">0</text><path d="M344.5 198V278" stroke="#e8eeeb"/><text x="344.5" y="191" text-anchor="middle" font-size="10" fill="#667773">263</text><path d="M490 198V278" stroke="#e8eeeb"/><text x="490" y="191" text-anchor="middle" font-size="10" fill="#667773">526</text><text x="42" y="232" font-size="12" font-weight="600" fill="#243f39"><title>LFM3-Audio-2B (Fusor q7 / CPU 6 threads)</title>LFM3-Audio-2B (Fusor q7…</text><text x="42" y="248" font-size="9" fill="#78847f">CPU</text><rect x="199" y="2